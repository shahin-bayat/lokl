version: 2

project_name: lokl

before:
  hooks:
    - go mod tidy
    - go build -o lokl ./cmd/lokl
    - mkdir -p completions
    - ./lokl completion bash > completions/lokl.bash
    - ./lokl completion zsh > completions/_lokl
    - ./lokl completion fish > completions/lokl.fish

builds:
  - main: ./cmd/lokl
    binary: lokl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/shahin-bayat/lokl/internal/version.Version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - completions/*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - repository:
      owner: shahin-bayat
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/shahin-bayat/lokl"
    description: "Local development environment orchestrator"
    license: "MIT"
    install: |
      bin.install "lokl"
      bash_completion.install "completions/lokl.bash" => "lokl"
      zsh_completion.install "completions/_lokl"
      fish_completion.install "completions/lokl.fish"
